{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2><i class="bi bi-pencil"></i> Edit Review</h2>

    <form method="POST" action="/reviews/manage?action=update&pkval={{ obj.data[0].review_id }}">
        {% if obj.errors|length > 0 %}
        <div class="alert alert-danger">
            {% for error in obj.errors %}<p class="error_text">{{ error }}</p>{% endfor %}
        </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Overall Rating *</label>
            <select class="form-select" name="rating" required>
                {% for i in range(1, 6) %}
                <option value="{{ i }}" {{ 'selected' if obj.data[0].rating == i else '' }}>{{ i }} Star{% if i > 1 %}s{% endif %}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Safety Rating *</label>
            <select class="form-select" name="safety_rating" required>
                {% for i in range(1, 6) %}
                <option value="{{ i }}" {{ 'selected' if obj.data[0].safety_rating == i else '' }}>{{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Access Rating *</label>
            <select class="form-select" name="access_rating" required>
                {% for i in range(1, 6) %}
                <option value="{{ i }}" {{ 'selected' if obj.data[0].access_rating == i else '' }}>{{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Visit Date *</label>
            <input type="date" class="form-control" name="visit_date" value="{{ obj.data[0].visit_date }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Review</label>
            <textarea class="form-control" name="review_text" rows="4">{{ obj.data[0].review_text if obj.data[0].review_text else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">Update Review</button>
        <a href="/reviews/manage" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
